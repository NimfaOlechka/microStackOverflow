services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8002:80"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: msfdb
      DB_USERNAME: msfuser
      DB_PASSWORD: msf_local_password
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: msfdb
      MYSQL_USER: msfuser
      MYSQL_PASSWORD: msf_local_password
      MYSQL_ROOT_PASSWORD: msf_root_local_password
    volumes:
      - microstackoverflow_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pmsf_root_local_password"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  microstackoverflow_db_data:
